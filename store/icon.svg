<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <!-- Umbra: an eclipse ring on a midnight sky, the corona bleeding out past the disc and
       a single bead of sunlight breaking through at the upper right. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C2E62"/>
      <stop offset="0.5" stop-color="#0D1838"/>
      <stop offset="1" stop-color="#05091B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC66E" stop-opacity="0.9"/>
      <stop offset="0.38" stop-color="#F7A845" stop-opacity="0.38"/>
      <stop offset="0.72" stop-color="#E8902F" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#E8902F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="disc" cx="0.64" cy="0.32" r="0.9">
      <stop offset="0" stop-color="#22325F"/>
      <stop offset="0.5" stop-color="#0C1533"/>
      <stop offset="1" stop-color="#03061A"/>
    </radialGradient>
    <linearGradient id="ring" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFF3D2"/>
      <stop offset="0.42" stop-color="#FFC66E"/>
      <stop offset="1" stop-color="#E0842A"/>
    </linearGradient>
    <filter id="wide" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108"><feGaussianBlur stdDeviation="5.5"/></filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108"><feGaussianBlur stdDeviation="1.7"/></filter>
    <filter id="hair" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108"><feGaussianBlur stdDeviation="0.55"/></filter>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4"/>
      <feOffset dy="2.2" result="o"/>
      <feFlood flood-color="#02040E" flood-opacity="0.75"/>
      <feComposite in2="o" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="bg">
    <rect width="108" height="108" fill="url(#sky)"/>
    <circle cx="54" cy="55" r="44" fill="url(#glow)"/>
    <circle cx="19" cy="17" r="1.1" fill="#FFF4DC" opacity="0.85"/>
    <circle cx="88" cy="13" r="0.8" fill="#FFF4DC" opacity="0.7"/>
    <circle cx="97" cy="41" r="0.6" fill="#FFF4DC" opacity="0.5"/>
    <circle cx="12" cy="66" r="0.7" fill="#FFF4DC" opacity="0.55"/>
    <circle cx="31" cy="93" r="0.9" fill="#FFF4DC" opacity="0.6"/>
    <circle cx="86" cy="90" r="0.6" fill="#FFF4DC" opacity="0.45"/>
    <circle cx="60" cy="8" r="0.6" fill="#FFF4DC" opacity="0.5"/>
    <circle cx="8" cy="38" r="0.5" fill="#FFF4DC" opacity="0.4"/>
  </g>

  <g id="fg">
    <!-- the corona: a wide soft glow, then the streamers, then a tighter halo on the ring -->
    <circle cx="54" cy="54" r="27" fill="#FFB454" opacity="0.72" filter="url(#wide)"/>
    <g fill="#FFD790" opacity="0.62" filter="url(#hair)"><polygon points="67.48,34.75 69.42,36.26 74.01,28.39"/><polygon points="75.43,44.37 76.11,46.04 84.13,41.83"/><polygon points="55.64,30.56 57.27,30.73 57.29,22.67"/><polygon points="77.13,58.16 76.82,59.61 83.83,60.34"/><polygon points="42.39,33.57 43.55,32.95 40.15,27.95"/><polygon points="72.39,68.63 71.6,69.57 75.83,72.32"/><polygon points="32.47,63.41 31.97,62.19 26.65,65.05"/><polygon points="32.42,44.7 33.01,43.44 26.36,41.11"/><polygon points="43.48,75.01 42.46,74.47 41.09,78.28"/><polygon points="45.46,32.11 46.47,31.74 44.59,28.16"/><polygon points="58.56,77.05 57.6,77.22 58.69,80.59"/></g>
    <circle cx="54" cy="54" r="23.5" fill="none" stroke="#FFC66E" stroke-width="4.5" opacity="0.55" filter="url(#soft)"/>
    <!-- the ring itself -->
    <circle cx="54" cy="54" r="23.5" fill="none" stroke="url(#ring)" stroke-width="2.7"/>
    <!-- the disc, with a soft tinted shadow so it sits in front of the light -->
    <circle cx="54" cy="54" r="22.3" fill="url(#disc)" filter="url(#shadow)"/>
    <!-- limb light: the edge nearest the bead catches a little -->
    <path d="M34.86 42.95 A22.1 22.1 0 0 1 75.98 51.69" fill="none" stroke="#FFF3D2" stroke-width="0.9" opacity="0.55" filter="url(#hair)"/>
    <!-- the bead: sunlight through a lunar valley -->
    <circle cx="67.14" cy="34.52" r="7" fill="#FFE2A6" opacity="0.75" filter="url(#soft)"/>
    <path d="M58.14 34.52h18M67.14 25.52v18" stroke="#FFF6E0" stroke-width="0.9" opacity="0.6" filter="url(#hair)"/>
    <circle cx="67.14" cy="34.52" r="3.1" fill="#FFF8E6"/>
  </g>

  <g id="mono">
    <path d="M54 29a25 25 0 1 0 0.01 0z M54 33.5a20.5 20.5 0 1 1 -0.01 0z" fill="#000" fill-rule="evenodd"/>
    <g fill="#000"><polygon points="68.23,33.45 70.5,35.22 74.02,28.37"/><polygon points="76.76,43.66 77.55,45.62 84.27,41.77"/><polygon points="55.66,29.05 57.57,29.26 57.32,22.37"/><polygon points="78.62,58.35 78.26,60.04 84.27,60.43"/><polygon points="41.59,32.3 42.95,31.58 39.87,27.42"/><polygon points="73.61,69.51 72.68,70.61 76.41,72.8"/></g>
    <circle cx="67.14" cy="34.52" r="4.2" fill="#000"/>
  </g>
</svg>
